<div class="login-container">
    <div class="login-box">
        <div class="login-header">
            <h2>Acceso</h2>
        </div>
        <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" formControlName="xcorreoInstitucional" placeholder="Usuario">
                <div *ngIf="loginForm.controls['xcorreoInstitucional'].invalid && (loginForm.controls['xcorreoInstitucional'].dirty || loginForm.controls['xcorreoInstitucional'].touched)" class="alert alert-danger">
                    <div *ngIf="loginForm.controls['xcorreoInstitucional'].errors?.['required']">El usuario es obligatorio.</div>
                    <div *ngIf="loginForm.controls['xcorreoInstitucional'].errors?.['email']">El formato del email es inválido.</div>
                </div>
            </div>
            <div class="form-group">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" formControlName="password" placeholder="Contraseña">
                <div *ngIf="loginForm.controls['password'].invalid && (loginForm.controls['password'].dirty || loginForm.controls['password'].touched)" class="alert alert-danger">
                    <div *ngIf="loginForm.controls['password'].errors?.['required']">La contraseña es obligatoria.</div>
                </div>
            </div>
            <button type="submit" class="btn-acceder" [disabled]="!loginForm.valid">ACCEDER</button>
            <a href="#" class="forgot-password">Recuperar contraseña</a>
        </form>
    </div>
</div>
